name: Java CI with Maven
'on':
  push:
    branches:
    - ci/fix/remove-ossrh-repository
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: adopt
        java-version: '11'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify --file pom.xml
